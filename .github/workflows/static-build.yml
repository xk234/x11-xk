name: Static build check

on:
  push:
    branches: [x11-recovery]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Verify Cloudflare Pages output
        run: test -f dist/client/index.html && test ! -f dist/client/_redirects
